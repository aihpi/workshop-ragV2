name: workshop-ragv2

services:
  ollama:
    image: ollama/ollama:0.5.4
    container_name: workshop-ollama
    ports:
      - "11434:11434"
    volumes:
      - ./ollama_storage:/root/.ollama
    restart: unless-stopped
