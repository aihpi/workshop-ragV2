name: workshop-ragv2-langflow

services:
  langflow:
    image: langflowai/langflow:1.9.0
    container_name: workshop-langflow
    ports:
      - "${LANGFLOW_PORT:-7860}:7860"
    env_file:
      - .env
    environment:
      LANGFLOW_AUTO_LOGIN: "${LANGFLOW_AUTO_LOGIN:-true}"
      LANGFLOW_SKIP_AUTH_AUTO_LOGIN: "true"
      LANGFLOW_SECRET_KEY: "${LANGFLOW_SECRET_KEY:-change-me}"
      LANGFLOW_DATABASE_URL: "sqlite:////app/langflow.db"
      LANGFLOW_LOG_LEVEL: "debug"
      LANGFLOW_COMPONENTS_PATH: "/app/components"
      QDRANT_URL: "http://${QDRANT_HOST:-host.docker.internal}:${QDRANT_PORT:-6333}"
      QDRANT_COLLECTION: "${QDRANT_COLLECTION:-workshop_rag}"
      OLLAMA_BASE_URL: "http://${OLLAMA_HOST:-host.docker.internal}:${OLLAMA_PORT:-11434}"
      OLLAMA_LLM_MODEL: "${OLLAMA_LLM_MODEL:-qwen2.5:7b-instruct}"
      OLLAMA_EMBED_MODEL: "${OLLAMA_EMBED_MODEL:-nomic-embed-text}"
    volumes:
      - ./flows:/app/flows
      - ./pdfs:/app/pdfs
      - ./data:/app/data
      - langflow_db:/app
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

volumes:
  langflow_db:
